name: Enderportal3

on:
  push:
    branches: [ "main", "master" ] # Запускать сборку при каждом сохранении

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build with Gradle
      run: gradle build
        chmod +x gradlew || true
        ./gradlew build

    - name: Upload Jar
      uses: actions/upload-artifact@v4
      with:
        name: Enderportal3-Jar-File
        path: build/libs/*.jar
